{{- if .Values.customPostgresql.enabled }}
{{- if .Values.postgresql.enabled }}
{{- fail "Enable either customPostgresql or the postgresql subchart" }}
{{- end }}
{{- if hasKey .Values.puppetdb.extraEnv "OPENVOXDB_POSTGRES_HOSTNAME" }}
{{- fail "Do not override OPENVOXDB_POSTGRES_HOSTNAME when customPostgresql is enabled" }}
{{- end }}
{{- $name := printf "%s-postgresql" (include "puppetserver.fullname" .) }}
{{- $config := .Values.customPostgresql }}
{{- $secret := required "customPostgresql.auth.existingSecret is required" $config.auth.existingSecret }}
{{- $account := default $name $config.serviceAccount.name }}
{{- if and (not $config.serviceAccount.create) (not $config.serviceAccount.name) }}
{{- fail "customPostgresql.serviceAccount.name is required when create is false" }}
{{- end }}
{{- if $config.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account }}
  namespace: {{ .Release.Namespace }}
---
{{- end }}
{{- if not $config.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  {{- with $config.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml $config.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ $config.persistence.size | quote }}
  {{- with $config.persistence.storageClass }}
  storageClassName: {{ ternary "" . (eq . "-") | quote }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: custom-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: custom-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: custom-postgresql
    spec:
      serviceAccountName: {{ $account }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgresql
          image: "{{ required "customPostgresql.image.repository is required" $config.image.repository }}:{{ required "customPostgresql.image.tag is required" $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy }}
          {{- with $config.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $config.auth.adminPasswordKey }}
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
            - name: OPENVOX_DATABASE
              value: {{ .Values.global.postgresql.auth.database | quote }}
            - name: OPENVOX_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $config.auth.usernameKey }}
            - name: OPENVOX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $config.auth.passwordKey }}
          ports:
            - name: postgresql
              containerPort: 5432
          startupProbe:
            exec:
              command: [sh, -ec, 'pg_isready -h 127.0.0.1 -U postgres -d "$OPENVOX_DATABASE"']
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -h 127.0.0.1 -U postgres -d "$OPENVOX_DATABASE"']
          livenessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -h 127.0.0.1 -U postgres -d "$OPENVOX_DATABASE"']
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: socket
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default $name $config.persistence.existingClaim }}
        - name: socket
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- if $config.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: custom-postgresql
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "puppetserver.puppetdb.matchLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
  egress: []
{{- end }}
{{- end }}
